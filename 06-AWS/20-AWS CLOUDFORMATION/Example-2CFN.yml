AWSTemplateFormatVersion: "2010-09-09"

Description: >
  This CloudFormation template creates an EC2 instance with a Security Group
  allowing SSH and HTTP access from anywhere, and installs Apache using UserData.

Parameters:
  KeyName:
    Description: Select an existing EC2 Key Pair to SSH into the instance
    Type: AWS::EC2::KeyPair::KeyName

  VpcId:
    Description: Select the VPC where the Security Group will be created
    Type: AWS::EC2::VPC::Id

  SubnetId:
    Description: Select the subnet where the EC2 instance will be launched
    Type: AWS::EC2::Subnet::Id

  LatestAmiId:
    Description: Amazon Linux 2023 AMI ID
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  InstanceType:
    Description: EC2 instance type
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t3.micro
      - t3.small

Resources:
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH and HTTP from anywhere
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Allow SSH from anywhere
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

        - Description: Allow HTTP from anywhere
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

      SecurityGroupEgress:
        - Description: Allow all outbound traffic
          IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: WebServer-SG

  WebServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref WebServerSecurityGroup

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf update -y
          dnf install -y httpd
          systemctl start httpd
          systemctl enable httpd

          echo "<h1>Hello from CloudFormation EC2 Instance</h1>" > /var/www/html/index.html
          echo "<p>Apache web server installed using UserData.</p>" >> /var/www/html/index.html

      Tags:
        - Key: Name
          Value: CloudFormation-WebServer

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref WebServerInstance

  PublicIp:
    Description: Public IP address of the EC2 instance
    Value: !GetAtt WebServerInstance.PublicIp

  PublicDNS:
    Description: Public DNS name of the EC2 instance
    Value: !GetAtt WebServerInstance.PublicDnsName

  WebsiteURL:
    Description: Open this URL in your browser
    Value: !Sub "http://${WebServerInstance.PublicDnsName}"